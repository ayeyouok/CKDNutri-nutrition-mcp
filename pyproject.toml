[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CKDNutri-nutrition-mcp"
version = "0.3.12"
description = "P2 营养计算域——PRNT目标+食物DB+食谱+生长Z+PEW+日记"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "a207-policy==0.3.8",
]

[project.scripts]
CKDNutri-nutrition-mcp = "CKDNutri_nutrition_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
CKDNutri_nutrition_mcp = ["data/*.json", "data/*.csv"]
